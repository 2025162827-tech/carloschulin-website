
<!DOCTYPE html>
<head>
  <title>Sum</title>
</head>
<body>

<p> Enter a number: </p>

  <input type="number" id="num1">
  <button onclick="add()">=</button>
 
<p>The sum of all even numbers is: </p>

  <h2 id="result"></h2>

  <script>
    function add() {
      let n1 = +num1.value;
      let even_sum = 0;

      for (let i = 1; i <= n1; i++) {
        if (i % 2 == 0) {
          even_sum = even_sum + i;
        }
      }

      let resultElement = document.getElementById('result');
      resultElement.textContent = even_sum;
    }
  </script>

</body>
</html>
