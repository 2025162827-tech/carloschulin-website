<!DOCTYPE html>

    <style>

        body {
            font-family: Arial;
            background-color: #f4f6f8;
            margin: 0;

        }


        header {
            background: linear-gradient(135deg, #003b73, #0077b6);
            color: white;
            padding: 30px;
        }


        header h1 {
            margin: 0;
        }


        header p {
            margin-bottom: 0;
        }


        nav {
            background-color: lightblue;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);

        .project h2 {
            color: #003b73;
            margin-top: 0;
        }


        .project p {
            font-size: 18px;
        }


        .presentation {
            width: 515px;
            height: 290px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }


        .presentation:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }


        .recording {
            display: inline-block;
            background-color: #0077b6;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
