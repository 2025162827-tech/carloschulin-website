<p>Enter any number from 0 to 127 :</p>
<input id="inputdec" >
<p></p>
<button onclick="decToASCII()">Submit</button>
<p></p>
<p>ASCII Value : </p>
<p id="demo"></p>

<script>
function decToASCII() {

    x = document.getElementById("inputdec").value;

    if (x < 0 || x > 127) {

        document.getElementById("demo").innerHTML = "Enter a number from 0 to 127";

    } else {

        var res = String.fromCharCode(x);

        document.getElementById("demo").innerHTML = res;

    }

}</script>
